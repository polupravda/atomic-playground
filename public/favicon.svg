<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64">
  <!-- Atomic Playground: a nucleus (red protons, grey neutrons) with three
       sky-blue electron orbits, in the app's own colours -->
  <defs>
    <radialGradient id="p" cx="0.35" cy="0.35" r="0.75">
      <stop offset="0" stop-color="#fca5a5" />
      <stop offset="0.45" stop-color="#ef4444" />
      <stop offset="1" stop-color="#991b1b" />
    </radialGradient>
    <radialGradient id="n" cx="0.35" cy="0.35" r="0.75">
      <stop offset="0" stop-color="#e2e8f0" />
      <stop offset="0.45" stop-color="#94a3b8" />
      <stop offset="1" stop-color="#475569" />
    </radialGradient>
    <radialGradient id="e" cx="0.35" cy="0.35" r="0.75">
      <stop offset="0" stop-color="#e0f2fe" />
      <stop offset="0.45" stop-color="#38bdf8" />
      <stop offset="1" stop-color="#0369a1" />
    </radialGradient>
  </defs>
  <rect width="64" height="64" rx="14" fill="#0f172a" />
  <g fill="none" stroke="#38bdf8" stroke-width="2.6" stroke-opacity="0.85">
    <ellipse cx="32" cy="32" rx="26" ry="10" />
    <ellipse cx="32" cy="32" rx="26" ry="10" transform="rotate(60 32 32)" />
    <ellipse cx="32" cy="32" rx="26" ry="10" transform="rotate(-60 32 32)" />
  </g>
  <circle cx="29" cy="30" r="5" fill="url(#p)" />
  <circle cx="35.5" cy="31" r="5" fill="url(#n)" />
  <circle cx="31.5" cy="36" r="5" fill="url(#p)" />
  <circle cx="58" cy="32" r="4" fill="url(#e)" />
  <circle cx="19" cy="9.5" r="4" fill="url(#e)" />
  <circle cx="19" cy="54.5" r="4" fill="url(#e)" />
</svg>
